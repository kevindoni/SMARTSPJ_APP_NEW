name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CRYPTO_KEY_VAL: ${{ secrets.CRYPTO_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt source (crypto filter + manual fallback for binary)
        shell: bash
        run: |
          # Setup crypto filter for JS/text files
          git config --local filter.crypto.clean "openssl aes-256-cbc -pbkdf2 -salt -pass env:CRYPTO_KEY_VAL"
          git config --local filter.crypto.smudge "openssl aes-256-cbc -pbkdf2 -d -pass env:CRYPTO_KEY_VAL"
          git config --local filter.crypto.required true

          # Force re-checkout with filter applied (decrypts text/JS files)
          git checkout --force HEAD

          # Manually decrypt any remaining encrypted binary files (PNG, etc)
          # Some binary files were committed encrypted despite -filter exception.
          find . -not -path './.git/*' -type f | while read -r f; do
            if head -c 8 "$f" 2>/dev/null | grep -q 'Salted__'; then
              openssl aes-256-cbc -pbkdf2 -d -pass env:CRYPTO_KEY_VAL -in "$f" -out "$f.tmp" 2>/dev/null && mv "$f.tmp" "$f" || rm -f "$f.tmp"
            fi
          done

          echo "=== Decrypt check ==="
          node -p "require('./package.json').version"
          echo "=== PNG header ==="
          head -c 8 electron/logo.png | xxd | head -1

      - name: Create .env (inject ARKAS_PASSWORD)
        shell: bash
        run: |
          echo "ARKAS_PASSWORD=${{ secrets.ARKAS_PASSWORD }}" > .env
          echo "SIMULASI_MODE=false" >> .env
          echo "DEVTOOLS=false" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild

      - name: Build (vite + jsc compile)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build installer (electron-builder + publish)
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartSPJ-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30

      - name: Publish release (un-draft + set latest)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --draft=false --latest \
            --title "v${VERSION}" \
            --notes "Lihat CHANGELOG.md" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
