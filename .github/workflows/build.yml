name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CRYPTO_KEY_VAL: ${{ secrets.CRYPTO_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup crypto filter + decrypt source
        shell: bash
        run: |
          git config --local filter.crypto.clean "openssl aes-256-cbc -pbkdf2 -salt -pass env:CRYPTO_KEY_VAL"
          git config --local filter.crypto.smudge "openssl aes-256-cbc -pbkdf2 -d -pass env:CRYPTO_KEY_VAL"
          git config --local filter.crypto.required true
          git checkout --force HEAD
          echo "=== Decrypt check: package.json version ==="
          node -p "require('./package.json').version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild

      - name: Build (vite + jsc compile)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build installer (electron-builder + publish)
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartSPJ-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30
