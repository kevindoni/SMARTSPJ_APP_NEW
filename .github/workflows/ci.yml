name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build (vite + jsc compile)
        run: npm run build
        env:
          ARKAS_PASSWORD: ${{ secrets.ARKAS_PASSWORD }}
          SIMULASI_MODE: 'false'
          DEVTOOLS: 'false'
