name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Build only, do not publish to Releases'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Write .env
        run: |
          New-Item -Path .env -ItemType File -Force | Out-Null
          Add-Content .env "ARKAS_PASSWORD=${{ secrets.ARKAS_PASSWORD }}"
          Add-Content .env "SIMULASI_MODE=false"
          Add-Content .env "DEVTOOLS=false"

      - name: Build installer + publish to GitHub Releases
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (no publish)
        if: ${{ github.event.inputs.skip_publish == 'true' }}
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ github.event.inputs.skip_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartSPJ-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
